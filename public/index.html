<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하루비 노래책</title>
<style>
  :root {
    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --blue-200: #bfdbfe;
    --blue-400: #60a5fa;
    --blue-500: #3b82f6;
    --blue-600: #2563eb;
    --blue-700: #1d4ed8;
    --blue-800: #1e40af;
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-700: #334155;
    --slate-800: #1e293b;
    --red-500: #ef4444;
    --red-600: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    background: linear-gradient(to bottom, var(--blue-50), #ffffff 30%, var(--blue-50));
    color: var(--slate-800);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--blue-700);
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  header .inner { max-width: 720px; margin: 0 auto; padding: 18px 16px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .icon {
    width: 36px; height: 36px; border-radius: 12px;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .brand p { font-size: 11px; color: #bfdbfe; margin: 2px 0 0; }
  .tabs { margin-top: 14px; display: flex; gap: 4px; background: rgba(0,0,0,.2); border-radius: 12px; padding: 4px; }
  .tab-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 0; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; background: transparent; color: #bfdbfe;
    transition: .15s;
  }
  .tab-btn.active { background: white; color: var(--blue-700); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  main { padding-top: 16px; }

  .search-box { position: relative; }
  .search-box input {
    width: 100%; padding: 10px 36px 10px 36px; border-radius: 12px;
    border: 1px solid var(--blue-200); font-size: 14px; background: white;
  }
  .search-box input:focus { outline: none; box-shadow: 0 0 0 2px var(--blue-400); }
  .search-box .icon-left { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--blue-400); font-size: 14px; }
  .search-box .icon-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--slate-400); cursor: pointer; background: none; border: none; font-size: 16px; line-height: 1;
  }

  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--blue-200); background: white; color: var(--blue-600); cursor: pointer;
    transition: .12s;
  }
  .chip.active { background: var(--blue-600); border-color: var(--blue-600); color: white; }

  .meta-row { margin: 14px 4px 8px; display: flex; justify-content: space-between; font-size: 11px; color: var(--slate-400); }

  .song-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .song-card {
    background: white; border: 1px solid var(--blue-100); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .fav-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--blue-500); flex-shrink: 0; padding: 0; }
  .song-info { flex: 1; min-width: 0; }
  .song-info .title { font-weight: 600; font-size: 13.5px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info .artist { font-size: 12px; color: var(--slate-500); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .genre-badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 42%; flex-shrink: 0; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }

  .empty-state { text-align: center; padding: 64px 0; color: var(--slate-400); font-size: 13px; }

  .card { background: white; border: 1px solid var(--blue-100); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .card h2 { font-size: 13.5px; font-weight: 700; color: var(--blue-700); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form-grid input, .form-grid select {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--blue-200); font-size: 13.5px; width: 100%; background: white;
  }
  .form-grid input:focus, .form-grid select:focus { outline: none; box-shadow: 0 0 0 2px var(--blue-400); }
  .fav-check { grid-column: span 2; display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--blue-200); font-size: 13.5px; cursor: pointer; }
  .genre-label { font-size: 11.5px; color: var(--slate-500); margin: 10px 0 6px; }
  .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre-chip { padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--blue-200); background: white; color: var(--blue-600); cursor: pointer; }
  .genre-chip.active { background: var(--blue-600); border-color: var(--blue-600); color: white; }
  .err-text { color: var(--red-500); font-size: 11.5px; margin: 8px 0 0; }
  .primary-btn {
    margin-top: 12px; width: 100%; padding: 10px 0; border-radius: 10px; border: none;
    background: var(--blue-600); color: white; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .primary-btn:hover { background: var(--blue-700); }

  .manage-list { margin-top: 20px; }
  .manage-list h2 { font-size: 13.5px; font-weight: 700; color: var(--blue-700); margin: 0 0 8px; padding: 0 4px; }
  .manage-card { background: white; border: 1px solid var(--blue-100); border-radius: 14px; padding: 12px 13px; }
  .manage-row { display: flex; align-items: center; gap: 10px; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; flex-shrink: 0; font-size: 15px; }
  .icon-btn.edit { color: var(--blue-600); }
  .icon-btn.edit:hover { background: var(--blue-50); }
  .icon-btn.del { color: var(--red-500); }
  .icon-btn.del:hover { background: #fef2f2; }

  .edit-form { display: flex; flex-direction: column; gap: 8px; }
  .edit-form input, .edit-form select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--blue-300); font-size: 13px; }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions button { flex: 1; padding: 7px 0; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }
  .edit-actions .save { background: var(--blue-600); color: white; }
  .edit-actions .save:disabled { background: var(--slate-100); color: var(--slate-400); cursor: not-allowed; }
  .edit-actions .cancel { background: var(--slate-100); color: var(--slate-500); }

  .confirm-row { display: flex; align-items: center; gap: 8px; }
  .confirm-row p { flex: 1; font-size: 13px; margin: 0; color: var(--slate-700); }
  .confirm-row button { padding: 7px 12px; border-radius: 8px; border: none; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .confirm-row .yes { background: var(--red-600); color: white; }
  .confirm-row .no { background: var(--slate-100); color: var(--slate-500); }

  .backup-note { text-align: center; font-size: 10.5px; color: var(--blue-100); margin-top: 6px; opacity: .8; }
  .sync-status {
    margin: 0 0 12px; padding: 9px 12px; border-radius: 12px;
    font-size: 11.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: white; border: 1px solid var(--blue-100); color: var(--slate-500);
  }
  .sync-status.ok { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
  .sync-status.saving, .sync-status.loading { color: var(--blue-700); background: var(--blue-50); }
  .sync-status.error { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
  .sync-status button {
    border: none; background: transparent; color: inherit; cursor: pointer; font-weight: 700; padding: 2px 4px;
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand">
      <div class="icon">💿</div>
      <div>
        <h1>하루비 노래책</h1>
        <p>공용 노래 리스트 · 모든 기기에서 같은 목록 사용</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabBookBtn" onclick="switchTab('book')">📖 노래책</button>
      <button class="tab-btn" id="tabManageBtn" onclick="switchTab('manage')">🎼 노래 관리</button>
    </div>
  </div>
</header>

<div class="wrap">
  <main id="mainArea"></main>
</div>

<script>
const GENRES = ["케이팝","제이팝","팝","발라드","댄스","아이돌","밴드","락","힙합","뮤지컬","인디","OST"];
const CATEGORIES = ["전체","즐겨찾기", ...GENRES];
const API_URL = "/.netlify/functions/songs";

const GENRE_COLORS = {
  "케이팝": ["#dbeafe","#1d4ed8"], "제이팝": ["#e0e7ff","#4338ca"], "팝": ["#e0f2fe","#0369a1"],
  "발라드": ["#cffafe","#0e7490"], "댄스": ["#dbeafe","#1e40af"], "아이돌": ["#e0e7ff","#3730a3"],
  "밴드": ["#e2e8f0","#334155"], "락": ["#fee2e2","#b91c1c"], "힙합": ["#fef3c7","#b45309"],
  "뮤지컬": ["#fae8ff","#a21caf"], "인디": ["#ccfbf1","#0f766e"], "OST": ["#ede9fe","#6d28d9"]
};

const SEED_SONGS = [
  { id:"s1", title:"밤편지", artist:"아이유", genres:["발라드"], favorite:true },
  { id:"s2", title:"Dynamite", artist:"방탄소년단", genres:["케이팝","댄스"], favorite:true },
  { id:"s3", title:"Lemon", artist:"요네즈 켄시", genres:["제이팝","발라드"], favorite:false },
  { id:"s4", title:"Perfect", artist:"Ed Sheeran", genres:["팝","발라드"], favorite:false },
  { id:"s5", title:"TT", artist:"TWICE", genres:["아이돌","케이팝"], favorite:false },
  { id:"s6", title:"Blueming", artist:"아이유", genres:["댄스"], favorite:false },
];

// ---- 상태 ----
let songs = [];
let loading = true;
let syncState = "loading";
let lastSyncAt = null;
let saveInFlight = false;
let savePending = false;
let tab = "book";
let query = "";
let selectedCats = ["전체"];
let draft = emptyDraft();
let addError = "";
let editingId = null;
let editDraft = null;
let confirmDeleteId = null;

function cloneSeeds() {
  return SEED_SONGS.map(s => ({...s, genres:[...s.genres]}));
}

function hasUnsavedDraft() {
  return !!(editingId || draft.title.trim() || draft.artist.trim() || draft.genres.length || draft.favorite);
}

function syncBanner() {
  const labels = {
    loading: "☁️ 공용 노래 목록 불러오는 중…",
    saving: "☁️ 변경사항을 모두에게 저장하는 중…",
    ok: "✓ 공용 목록과 동기화됨",
    error: "⚠️ 공용 저장공간에 연결하지 못했어요"
  };
  const extra = syncState === "ok" && lastSyncAt
    ? `<span>${new Date(lastSyncAt).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"})}</span>`
    : `<button id="retrySyncBtn">다시 연결</button>`;
  return `<div class="sync-status ${syncState}"><span>${labels[syncState]}</span>${extra}</div>`;
}

async function loadSongs({ silent = false } = {}) {
  try {
    if (!silent) {
      loading = true;
      syncState = "loading";
      render();
    }
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data.songs)) throw new Error("잘못된 응답");
    songs = data.songs;
    syncState = "ok";
    lastSyncAt = Date.now();
  } catch (e) {
    console.warn("공용 목록 불러오기 실패", e);
    if (!silent && songs.length === 0) songs = cloneSeeds();
    syncState = "error";
  } finally {
    if (!silent) loading = false;
    render();
  }
}

async function persist() {
  savePending = true;
  if (saveInFlight) return;

  saveInFlight = true;
  while (savePending) {
    savePending = false;
    const snapshot = songs.map(s => ({...s, genres:[...s.genres]}));
    syncState = "saving";
    render();

    try {
      const res = await fetch(API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ songs: snapshot })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (Array.isArray(data.songs)) songs = data.songs;
      syncState = "ok";
      lastSyncAt = Date.now();
    } catch (e) {
      console.warn("공용 저장 실패", e);
      syncState = "error";
      savePending = false;
    }
  }
  saveInFlight = false;
  render();
}

async function refreshFromServer() {
  if (loading || saveInFlight || hasUnsavedDraft()) return;
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (!Array.isArray(data.songs)) return;
    const before = JSON.stringify(songs);
    const after = JSON.stringify(data.songs);
    if (before !== after) {
      songs = data.songs;
      lastSyncAt = Date.now();
      syncState = "ok";
      render();
    }
  } catch (_) {}
}

function emptyDraft() { return { title:"", artist:"", genres:[], favorite:false }; }
function uid() { return "s" + Math.random().toString(36).slice(2,10); }
function toggleInArray(arr, item) { return arr.includes(item) ? arr.filter(x => x !== item) : [...arr, item]; }
function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function badge(g) {
  const [bg, fg] = GENRE_COLORS[g] || ["#f1f5f9","#334155"];
  return `<span class="badge" style="background:${bg};color:${fg}">${esc(g)}</span>`;
}

function switchTab(t) {
  tab = t;
  document.getElementById("tabBookBtn").classList.toggle("active", t === "book");
  document.getElementById("tabManageBtn").classList.toggle("active", t === "manage");
  render();
}

function render() {
  const main = document.getElementById("mainArea");
  if (loading) {
    main.innerHTML = `<div class="empty-state">☁️<br/>공용 노래 목록을 불러오는 중이에요.</div>`;
    return;
  }
  main.innerHTML = syncBanner() + (tab === "book" ? renderBook() : renderManage());
  bindEvents();

  const retry = document.getElementById("retrySyncBtn");
  if (retry) retry.addEventListener("click", () => loadSongs());
}

// ---------------- 노래책 화면 ----------------
function renderBook() {
  const q = query.trim().toLowerCase();
  const wantFav = selectedCats.includes("즐겨찾기");
  const wantGenres = selectedCats.filter(c => GENRES.includes(c));
  const isAll = selectedCats.includes("전체");

  const filtered = songs.filter(s => {
    if (q && !(s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q))) return false;
    if (isAll) return true;
    if (wantFav && !s.favorite) return false;
    if (wantGenres.length > 0 && !wantGenres.some(g => s.genres.includes(g))) return false;
    return true;
  });

  const chips = CATEGORIES.map(cat => {
    const active = selectedCats.includes(cat);
    const star = cat === "즐겨찾기" ? (active ? "★ " : "☆ ") : "";
    return `<button class="chip ${active ? "active" : ""}" data-cat="${esc(cat)}">${star}${esc(cat)}</button>`;
  }).join("");

  const list = filtered.length === 0
    ? `<div class="empty-state">🎵<br/>조건에 맞는 노래가 없어요.</div>`
    : `<ul class="song-list">${filtered.map(s => `
        <li class="song-card">
          <button class="fav-btn" data-fav="${s.id}">${s.favorite ? "★" : "☆"}</button>
          <div class="song-info">
            <p class="title">${esc(s.title)}</p>
            <p class="artist">${esc(s.artist)}</p>
          </div>
          <div class="genre-badges">${s.genres.map(badge).join("")}</div>
        </li>`).join("")}</ul>`;

  return `
    <div class="search-box">
      <span class="icon-left">🔍</span>
      <input id="searchInput" type="text" placeholder="곡명 또는 가수 검색" value="${esc(query)}" />
      ${query ? `<button class="icon-clear" id="clearSearch">✕</button>` : ""}
    </div>
    <div class="chips">${chips}</div>
    <div class="meta-row">
      <span>${filtered.length}곡 ${selectedCats.includes("전체") ? "" : "· 필터 적용됨"}</span>
      <span>전체 ${songs.length}곡</span>
    </div>
    ${list}
  `;
}

// ---------------- 노래 관리 화면 ----------------
function renderManage() {
  const genreChips = GENRES.map(g => {
    const active = draft.genres.includes(g);
    return `<button type="button" class="genre-chip ${active ? "active" : ""}" data-draft-genre="${esc(g)}">${esc(g)}</button>`;
  }).join("");

  const listHtml = songs.length === 0
    ? `<p class="empty-state">등록된 노래가 없어요.</p>`
    : songs.map(s => {
        if (editingId === s.id) {
          const eg = GENRES.map(g => {
            const active = editDraft.genres.includes(g);
            return `<button type="button" class="genre-chip ${active ? "active" : ""}" data-edit-genre="${esc(g)}" style="padding:4px 10px;font-size:10.5px;">${esc(g)}</button>`;
          }).join("");
          return `
            <li class="manage-card" style="list-style:none;margin-bottom:8px;">
              <div class="edit-form">
                <div class="form-grid">
                  <input id="editTitle" type="text" value="${esc(editDraft.title)}" />
                  <input id="editArtist" type="text" value="${esc(editDraft.artist)}" />
                </div>
                <div>
                  <p class="genre-label" style="margin:2px 0 4px;">장르 (여러 개 선택 가능)</p>
                  <div class="genre-chips">${eg}</div>
                </div>
                <div class="edit-actions">
                  <button class="save" id="saveEditBtn" ${editDraft.genres.length === 0 ? "disabled" : ""}>✓ 저장</button>
                  <button class="cancel" id="cancelEditBtn">✕ 취소</button>
                </div>
              </div>
            </li>`;
        }
        if (confirmDeleteId === s.id) {
          return `
            <li class="manage-card" style="list-style:none;margin-bottom:8px;">
              <div class="confirm-row">
                <p>⚠️ <b>${esc(s.title)}</b> 삭제할까요?</p>
                <button class="yes" data-confirm-del="${s.id}">삭제</button>
                <button class="no" id="cancelDelBtn">취소</button>
              </div>
            </li>`;
        }
        return `
          <li class="manage-card" style="list-style:none;margin-bottom:8px;">
            <div class="manage-row">
              ${s.favorite ? '<span style="color:var(--blue-500);flex-shrink:0;">★</span>' : ""}
              <div class="song-info">
                <p class="title">${esc(s.title)}</p>
                <p class="artist">${esc(s.artist)}</p>
              </div>
              <div class="genre-badges">${s.genres.map(badge).join("")}</div>
              <button class="icon-btn edit" data-edit="${s.id}">✏️</button>
              <button class="icon-btn del" data-del="${s.id}">🗑️</button>
            </div>
          </li>`;
      }).join("");

  return `
    <div class="card">
      <h2>➕ 노래 추가</h2>
      <div class="form-grid">
        <input id="draftTitle" type="text" placeholder="곡명" value="${esc(draft.title)}" />
        <input id="draftArtist" type="text" placeholder="가수" value="${esc(draft.artist)}" />
        <label class="fav-check">
          <input type="checkbox" id="draftFav" ${draft.favorite ? "checked" : ""} />
          즐겨찾기로 추가
        </label>
      </div>
      <p class="genre-label">장르 (여러 개 선택 가능)</p>
      <div class="genre-chips">${genreChips}</div>
      ${addError ? `<p class="err-text">${esc(addError)}</p>` : ""}
      <button class="primary-btn" id="addBtn">＋ 추가하기</button>
    </div>
    <div class="manage-list">
      <h2>등록된 노래 (${songs.length})</h2>
      <ul style="padding:0;margin:0;">${listHtml}</ul>
    </div>
  `;
}

// ---------------- 이벤트 바인딩 ----------------
function bindEvents() {
  if (tab === "book") {
    const input = document.getElementById("searchInput");
    if (input) {
      input.addEventListener("input", e => { query = e.target.value; render(); preserveFocus("searchInput"); });
    }
    const clearBtn = document.getElementById("clearSearch");
    if (clearBtn) clearBtn.addEventListener("click", () => { query = ""; render(); });

    document.querySelectorAll("[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cat = btn.getAttribute("data-cat");
        if (cat === "전체") { selectedCats = ["전체"]; }
        else {
          let next = selectedCats.includes("전체") ? [] : [...selectedCats];
          next = next.includes(cat) ? next.filter(c => c !== cat) : [...next, cat];
          selectedCats = next.length === 0 ? ["전체"] : next;
        }
        render();
      });
    });

    document.querySelectorAll("[data-fav]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-fav");
        songs = songs.map(s => s.id === id ? {...s, favorite: !s.favorite} : s);
        persist();
        render();
      });
    });
  } else {
    const t = document.getElementById("draftTitle");
    const a = document.getElementById("draftArtist");
    const f = document.getElementById("draftFav");
    if (t) t.addEventListener("input", e => { draft.title = e.target.value; });
    if (a) a.addEventListener("input", e => { draft.artist = e.target.value; });
    if (f) f.addEventListener("change", e => { draft.favorite = e.target.checked; });

    document.querySelectorAll("[data-draft-genre]").forEach(btn => {
      btn.addEventListener("click", () => {
        const g = btn.getAttribute("data-draft-genre");
        draft.genres = toggleInArray(draft.genres, g);
        render();
      });
    });

    const addBtn = document.getElementById("addBtn");
    if (addBtn) addBtn.addEventListener("click", () => {
      if (!draft.title.trim() || !draft.artist.trim()) { addError = "곡명과 가수를 모두 입력해 주세요."; render(); return; }
      if (draft.genres.length === 0) { addError = "장르를 하나 이상 선택해 주세요."; render(); return; }
      addError = "";
      songs = [{ id: uid(), title: draft.title.trim(), artist: draft.artist.trim(), genres: draft.genres, favorite: draft.favorite }, ...songs];
      draft = emptyDraft();
      persist();
      render();
    });

    document.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-edit");
        confirmDeleteId = null;
        editingId = id;
        const s = songs.find(x => x.id === id);
        editDraft = { title: s.title, artist: s.artist, genres: [...s.genres] };
        render();
      });
    });

    document.querySelectorAll("[data-edit-genre]").forEach(btn => {
      btn.addEventListener("click", () => {
        const g = btn.getAttribute("data-edit-genre");
        editDraft.genres = toggleInArray(editDraft.genres, g);
        render();
      });
    });

    const editTitle = document.getElementById("editTitle");
    const editArtist = document.getElementById("editArtist");
    if (editTitle) editTitle.addEventListener("input", e => { editDraft.title = e.target.value; });
    if (editArtist) editArtist.addEventListener("input", e => { editDraft.artist = e.target.value; });

    const saveEditBtn = document.getElementById("saveEditBtn");
    if (saveEditBtn) saveEditBtn.addEventListener("click", () => {
      if (!editDraft.title.trim() || !editDraft.artist.trim() || editDraft.genres.length === 0) return;
      songs = songs.map(s => s.id === editingId ? { ...s, title: editDraft.title.trim(), artist: editDraft.artist.trim(), genres: editDraft.genres } : s);
      editingId = null; editDraft = null;
      persist();
      render();
    });
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    if (cancelEditBtn) cancelEditBtn.addEventListener("click", () => { editingId = null; editDraft = null; render(); });

    document.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingId = null;
        confirmDeleteId = btn.getAttribute("data-del");
        render();
      });
    });
    document.querySelectorAll("[data-confirm-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-confirm-del");
        songs = songs.filter(s => s.id !== id);
        confirmDeleteId = null;
        persist();
        render();
      });
    });
    const cancelDelBtn = document.getElementById("cancelDelBtn");
    if (cancelDelBtn) cancelDelBtn.addEventListener("click", () => { confirmDeleteId = null; render(); });
  }
}

function preserveFocus(id) {
  const el = document.getElementById(id);
  if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
}

async function init() {
  render();
  await loadSongs();
  setInterval(refreshFromServer, 10000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshFromServer();
  });
  window.addEventListener("focus", refreshFromServer);
}

init();
</script>
